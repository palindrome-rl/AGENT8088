# Agent8088 — run in Docker without a system-wide install.
#
# Interactive REPL (one-off, container removed on exit):
#   docker compose run --rm agent8088
#
# Messaging gateway (persistent background service):
#   docker compose up -d gateway
#   docker compose logs -f gateway
#
# First-time setup (config wizard, writes to the named volume):
#   docker compose run --rm agent8088 --setup
#
# Config, tokens, sessions and memory all live in the `agent8088-data`
# named volume, mounted at the container's AGENT8088_HOME. Run `--setup`
# once to configure a provider and model; after that `--gateway` works
# headless.
#
# Prefer the named volume over a bind mount (./data:/home/a8088/.agent8088):
# a bind-mounted host directory keeps its host owner, and the container's
# a8088 user (usually uid 1000) cannot write to it unless you
# `sudo chown -R 1000:1000 ./data` first. The entrypoint says so on startup.
services:
  agent8088:
    build: .
    stdin_open: true
    tty: true
    volumes:
      - agent8088-data:/home/a8088/.agent8088
      # Docker socket for run_sandboxed (sandbox_backend=docker). Omit if
      # the agent stays readonly — the socket gives the container access to
      # spawn sibling containers on the host.
      - /var/run/docker.sock:/var/run/docker.sock
    # The container runs as the non-root a8088 user, which can only use the
    # socket as a member of the group that owns it on the HOST. Find that gid
    # with `stat -c %g /var/run/docker.sock` (Linux) and uncomment:
    # group_add:
    #   - "999"

  gateway:
    build: .
    restart: unless-stopped
    command: ["--gateway"]
    volumes:
      - agent8088-data:/home/a8088/.agent8088
      - /var/run/docker.sock:/var/run/docker.sock
    # Same as above: needed for the docker sandbox backend.
    # group_add:
    #   - "999"

volumes:
  agent8088-data:
