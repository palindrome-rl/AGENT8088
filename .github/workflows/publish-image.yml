name: Publish Docker image

on:
  push:
    branches: [AGENT8088-v1.4]
    tags: ["v*"]
    # Docs-only releases don't rebuild the image. Tag pushes ignore path
    # filters, so a version tag always publishes.
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "assets/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/palindrome-rl/agent8088

jobs:
  publish:
    # Every branch carries this file; only production and release tags publish,
    # including when the workflow is started by hand.
    if: github.ref == 'refs/heads/AGENT8088-v1.4' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=1.4.0,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # The Docker sandbox fallback's image (Python, Node, git). Its tag is the
      # one engine.py pulls by default, so it is published with each release.
      - id: sandbox-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/palindrome-rl/agent8088-sandbox
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=1.4.0,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' }}
      - uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/sandbox.Dockerfile
          push: true
          tags: ${{ steps.sandbox-meta.outputs.tags }}
          labels: ${{ steps.sandbox-meta.outputs.labels }}
