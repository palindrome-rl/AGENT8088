name: CI

on:
  push:
    branches: [development, staging-1.4, AGENT8088-v1.4]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff (syntax errors and undefined names)
        run: pipx run ruff==0.8.6 check --select E9,F63,F7,F82 --output-format=github src scripts
      - name: Duplicate top-level definitions
        run: python scripts/check_duplicate_defs.py
      - name: Byte-compile
        run: python -m compileall -q src scripts
      - name: Shell syntax
        run: bash -n install.sh docker-entrypoint.sh
      - name: Installer portability (bash 3.2, BSD tools)
        run: bash scripts/check_installer_portability.sh

  # The full suite runs where code changes: pushes and PRs into development, and
  # any PR into staging-1.4 or AGENT8088-v1.4 that is not a plain promotion
  # (a hotfix). A promotion carries a tree that already passed this job on
  # development; the `promotion` job below checks that nothing else rides along.
  tests:
    name: Test suite
    if: >-
      github.event_name != 'pull_request'
      || github.base_ref == 'development'
      || !((github.base_ref == 'staging-1.4' && github.head_ref == 'development')
           || (github.base_ref == 'AGENT8088-v1.4' && github.head_ref == 'staging-1.4'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra gateway --extra repository
      - name: Run the tests in a throwaway home
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/home" AGENT8088_HOME="$RUNNER_TEMP/home/.agent8088"
          mkdir -p "$AGENT8088_HOME"
          uv run --extra dev --extra gateway --extra repository python -m pytest -q -rfE

  # Tier 0: the saved benchmark runs in tests/verdict_corpus/ are judged again by this change's verdict code. They
  # are Windows runs with Windows paths, so they run here; the Linux job above skips them.
  verdict-corpus:
    name: Verdict corpus (saved benchmark runs)
    if: >-
      github.event_name != 'pull_request'
      || github.base_ref == 'development'
      || !((github.base_ref == 'staging-1.4' && github.head_ref == 'development')
           || (github.base_ref == 'AGENT8088-v1.4' && github.head_ref == 'staging-1.4'))
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Replay the saved runs in a throwaway home
        shell: bash
        run: |
          export AGENT8088_HOME="$RUNNER_TEMP/home/.agent8088"
          mkdir -p "$AGENT8088_HOME"
          uv run --extra dev python -m pytest -q -rfE tests/test_verdict_corpus.py

  # Real commands that try to get out of the sandbox (tests/test_sandbox_attacks.py): srt with bubblewrap and the
  # Docker fallback on Linux, srt with sandbox-exec on macOS. The Windows runner needs an administrator setup a hosted
  # runner does not allow, so its run is part of the release checklist on a Windows machine.
  sandbox-attacks:
    name: Sandbox attack tests (${{ matrix.os }})
    if: >-
      github.event_name != 'pull_request'
      || github.base_ref == 'development'
      || !((github.base_ref == 'staging-1.4' && github.head_ref == 'development')
           || (github.base_ref == 'AGENT8088-v1.4' && github.head_ref == 'staging-1.4'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backends: native,docker
          - os: macos-latest
            backends: native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the sandbox runtime (the version engine.py pins)
        shell: bash
        run: |
          version=$(sed -n 's/^_SANDBOX_RUNTIME_DEFAULT = "\(.*\)"/\1/p' src/agent8088/engine.py)
          npm install -g "@anthropic-ai/sandbox-runtime@${version}"
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -q && sudo apt-get install -y -q bubblewrap socat ripgrep
            # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor. Ubuntu's way to let
            # one program use them is a profile for it; this is the one install.sh suggests.
            printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
              'profile agent8088-bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' \
              '  include if exists <local/agent8088-bwrap>' '}' | sudo tee /etc/apparmor.d/agent8088-bwrap >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/agent8088-bwrap
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0 || true
            sudo sysctl kernel.unprivileged_userns_clone 2>/dev/null || true
            bwrap --unshare-all --dev-bind / / true && echo 'bwrap with a network namespace works' || echo 'bwrap with a network namespace fails'
          else
            brew install ripgrep
          fi
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Run the attack tests in a throwaway home
        shell: bash
        env:
          AGENT8088_ATTACK_TESTS: "1"
          AGENT8088_ATTACK_BACKENDS: ${{ matrix.backends }}
        run: |
          export AGENT8088_HOME="$RUNNER_TEMP/home/.agent8088" AGENT8088_ATTACK_ROOT="$RUNNER_TEMP/attack"
          mkdir -p "$AGENT8088_HOME" "$AGENT8088_ATTACK_ROOT"
          uv run --extra dev python -m pytest -q -rfEs tests/test_sandbox_attacks.py

  promotion:
    name: Promotion carries only the source tree
    if: >-
      github.event_name == 'pull_request'
      && ((github.base_ref == 'staging-1.4' && github.head_ref == 'development')
          || (github.base_ref == 'AGENT8088-v1.4' && github.head_ref == 'staging-1.4'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: The merged tree equals the promoted branch
        run: |
          # The checkout is GitHub's merge of the PR: parent 2 is the branch being
          # promoted. Any difference means the target branch has content of its
          # own, which must come in through development instead.
          if ! git diff --quiet HEAD^2 HEAD; then
            echo "::error::The target branch differs from ${{ github.head_ref }}:"
            git diff --stat HEAD^2 HEAD
            exit 1
          fi

  smoke:
    name: Install smoke test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package
        run: python -m pip install .
      - name: Installer regression checks
        run: |
          python -m pip install pytest
          python -m pytest scripts/installer_checks -q
      - name: Run the CLI in a throwaway home
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/home" AGENT8088_HOME="$RUNNER_TEMP/home/.agent8088"
          mkdir -p "$AGENT8088_HOME"
          agent8088 --version
          python -c "import agent8088.engine as e; assert e.TOOL_SPECS, 'no tools loaded'"
