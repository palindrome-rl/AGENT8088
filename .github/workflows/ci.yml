name: CI

on:
  push:
    branches: [development, staging-1.3, AGENT8088-v1.3]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff (syntax errors and undefined names)
        run: pipx run ruff==0.8.6 check --select E9,F63,F7,F82 --output-format=github src scripts
      - name: Duplicate top-level definitions
        run: python scripts/check_duplicate_defs.py
      - name: Byte-compile
        run: python -m compileall -q src scripts
      - name: Shell syntax
        run: bash -n install.sh docker-entrypoint.sh
      - name: Installer portability (bash 3.2, BSD tools)
        run: bash scripts/check_installer_portability.sh

  # The full suite runs where code changes: pushes and PRs into development, and
  # any PR into staging-1.3 or AGENT8088-v1.3 that is not a plain promotion
  # (a hotfix). A promotion carries a tree that already passed this job on
  # development; the `promotion` job below checks that nothing else rides along.
  tests:
    name: Test suite
    if: >-
      github.event_name != 'pull_request'
      || github.base_ref == 'development'
      || !((github.base_ref == 'staging-1.3' && github.head_ref == 'development')
           || (github.base_ref == 'AGENT8088-v1.3' && github.head_ref == 'staging-1.3'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra gateway --extra repository
      - name: Run the tests in a throwaway home
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/home" AGENT8088_HOME="$RUNNER_TEMP/home/.agent8088"
          mkdir -p "$AGENT8088_HOME"
          uv run --extra dev --extra gateway --extra repository python -m pytest -q -rfE

  promotion:
    name: Promotion carries only the source tree
    if: >-
      github.event_name == 'pull_request'
      && ((github.base_ref == 'staging-1.3' && github.head_ref == 'development')
          || (github.base_ref == 'AGENT8088-v1.3' && github.head_ref == 'staging-1.3'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: The merged tree equals the promoted branch
        run: |
          # The checkout is GitHub's merge of the PR: parent 2 is the branch being
          # promoted. Any difference means the target branch has content of its
          # own, which must come in through development instead.
          if ! git diff --quiet HEAD^2 HEAD; then
            echo "::error::The target branch differs from ${{ github.head_ref }}:"
            git diff --stat HEAD^2 HEAD
            exit 1
          fi

  smoke:
    name: Install smoke test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package
        run: python -m pip install .
      - name: Installer regression checks
        run: |
          python -m pip install pytest
          python -m pytest scripts/installer_checks -q
      - name: Run the CLI in a throwaway home
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/home" AGENT8088_HOME="$RUNNER_TEMP/home/.agent8088"
          mkdir -p "$AGENT8088_HOME"
          agent8088 --version
          python -c "import agent8088.engine as e; assert e.TOOL_SPECS, 'no tools loaded'"
