name: CI

on:
  push:
    branches: [AGENT8088-v1.2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff (syntax errors and undefined names)
        run: pipx run ruff==0.8.6 check --select E9,F63,F7,F82 --output-format=github src scripts
      - name: Duplicate top-level definitions
        run: python scripts/check_duplicate_defs.py
      - name: Byte-compile
        run: python -m compileall -q src scripts
      - name: Shell syntax
        run: bash -n install.sh docker-entrypoint.sh
      - name: Installer portability (bash 3.2, BSD tools)
        run: bash scripts/check_installer_portability.sh

  smoke:
    name: Install smoke test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package
        run: python -m pip install .
      - name: Run the CLI in a throwaway home
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/home" AGENT8088_HOME="$RUNNER_TEMP/home/.agent8088"
          mkdir -p "$AGENT8088_HOME"
          agent8088 --version
          python -c "import agent8088.engine as e; assert e.TOOL_SPECS, 'no tools loaded'"
