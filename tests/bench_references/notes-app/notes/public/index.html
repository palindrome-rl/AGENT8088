<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0; padding: 1.5rem;
    background: #f4f5f7; color: #1c1e21;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #181a1f; color: #e6e8eb; }
    .card, .panel { background: #23262d; border-color: #33373f; }
    input, textarea, select { background: #181a1f; color: #e6e8eb; border-color: #3a3f48; }
  }
  h1 { margin: 0 0 1rem; font-size: 1.5rem; }
  .panel {
    background: #fff; border: 1px solid #d8dbe0; border-radius: 10px;
    padding: 1rem; margin-bottom: 1rem;
  }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  input, textarea, select, button {
    font: inherit; padding: .45rem .6rem; border-radius: 6px;
    border: 1px solid #c6cad1;
  }
  input[type=text], input:not([type]) { flex: 1; min-width: 12rem; }
  textarea { width: 100%; min-height: 5rem; resize: vertical; }
  button {
    background: #2563eb; color: #fff; border: none; cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  button.secondary { background: #6b7280; }
  button.secondary:hover { background: #4b5563; }
  button.danger { background: #dc2626; }
  button.danger:hover { background: #b91c1c; }
  .card {
    background: #fff; border: 1px solid #d8dbe0; border-radius: 10px;
    padding: .9rem 1rem; margin-bottom: .75rem;
  }
  .card h3 { margin: 0 0 .3rem; font-size: 1.05rem; }
  .card .body { white-space: pre-wrap; margin: 0 0 .5rem; }
  .tags { display: flex; gap: .35rem; flex-wrap: wrap; margin-bottom: .5rem; }
  .tag {
    background: #e0e7ff; color: #3730a3; border-radius: 999px;
    padding: .1rem .6rem; font-size: .8rem; cursor: pointer;
  }
  .tag:hover { background: #c7d2fe; }
  .actions { display: flex; gap: .4rem; }
  .actions button { font-size: .85rem; padding: .3rem .7rem; }
  .empty { color: #6b7280; font-style: italic; }
  .filters { margin-bottom: .75rem; }
  .filters label { font-size: .9rem; margin-right: .25rem; }
  .error { color: #dc2626; margin-top: .5rem; font-size: .9rem; }
  .hidden { display: none; }
</style>
</head>
<body>
<h1>Notes</h1>

<div class="panel">
  <div class="row">
    <input id="f-tag" type="text" placeholder="Filter by tag (exact)">
    <input id="f-q" type="text" placeholder="Search title or body…">
    <button class="secondary" id="f-clear">Clear</button>
  </div>
</div>

<div class="panel" id="form-panel">
  <h3 id="form-title">Add a note</h3>
  <div class="row" style="margin-bottom:.5rem">
    <input id="n-title" type="text" placeholder="Title" style="flex:2">
  </div>
  <textarea id="n-body" placeholder="Body"></textarea>
  <div class="row" style="margin-top:.5rem">
    <input id="n-tags" type="text" placeholder="Tags, comma-separated">
    <button id="n-save">Save</button>
    <button class="secondary hidden" id="n-cancel">Cancel</button>
  </div>
  <div class="error hidden" id="form-error"></div>
</div>

<div id="notes"></div>

<script>
const $ = (id) => document.getElementById(id);
let editingId = null;
let notes = [];

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (res.status === 204) return null;
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error((data && data.error) || res.statusText);
  return data;
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

function parseTags(s) {
  return s.split(",").map(t => t.trim()).filter(Boolean);
}

async function load() {
  const tag = $("f-tag").value.trim();
  const q = $("f-q").value.trim();
  const params = new URLSearchParams();
  if (tag) params.set("tag", tag);
  if (q) params.set("q", q);
  const qs = params.toString();
  notes = await api("/api/notes" + (qs ? "?" + qs : ""));
  render();
}

function render() {
  const box = $("notes");
  box.innerHTML = "";
  if (!notes.length) {
    box.innerHTML = '<p class="empty">No notes match.</p>';
    return;
  }
  for (const n of notes) {
    const card = document.createElement("div");
    card.className = "card";
    const tags = (n.tags || []).map(t =>
      `<span class="tag" data-tag="${esc(t)}">${esc(t)}</span>`).join("");
    card.innerHTML = `
      <h3>${esc(n.title)}</h3>
      <p class="body">${esc(n.body)}</p>
      <div class="tags">${tags}</div>
      <div class="actions">
        <button class="secondary" data-edit="${n.id}">Edit</button>
        <button class="danger" data-del="${n.id}">Delete</button>
      </div>`;
    box.appendChild(card);
  }
  box.querySelectorAll("[data-edit]").forEach(b =>
    b.addEventListener("click", () => startEdit(Number(b.dataset.edit))));
  box.querySelectorAll("[data-del]").forEach(b =>
    b.addEventListener("click", () => removeNote(Number(b.dataset.del))));
  box.querySelectorAll(".tag").forEach(t =>
    t.addEventListener("click", () => {
      $("f-tag").value = t.dataset.tag;
      load();
    }));
}

function resetForm() {
  editingId = null;
  $("form-title").textContent = "Add a note";
  $("n-title").value = "";
  $("n-body").value = "";
  $("n-tags").value = "";
  $("n-cancel").classList.add("hidden");
  $("n-save").textContent = "Save";
  $("form-error").classList.add("hidden");
}

function startEdit(id) {
  const n = notes.find(x => x.id === id);
  if (!n) return;
  editingId = id;
  $("form-title").textContent = "Edit note";
  $("n-title").value = n.title;
  $("n-body").value = n.body;
  $("n-tags").value = (n.tags || []).join(", ");
  $("n-cancel").classList.remove("hidden");
  $("n-save").textContent = "Update";
  $("form-error").classList.add("hidden");
  $("n-title").focus();
}

async function saveNote() {
  const title = $("n-title").value.trim();
  const body = $("n-body").value;
  const tags = parseTags($("n-tags").value);
  if (!title) {
    $("form-error").textContent = "Title is required.";
    $("form-error").classList.remove("hidden");
    return;
  }
  const payload = JSON.stringify({ title, body, tags });
  try {
    if (editingId === null) {
      await api("/api/notes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: payload,
      });
    } else {
      await api("/api/notes/" + editingId, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: payload,
      });
    }
    resetForm();
    await load();
  } catch (e) {
    $("form-error").textContent = e.message;
    $("form-error").classList.remove("hidden");
  }
}

async function removeNote(id) {
  if (!confirm("Delete this note?")) return;
  try {
    await api("/api/notes/" + id, { method: "DELETE" });
    if (editingId === id) resetForm();
    await load();
  } catch (e) {
    alert(e.message);
  }
}

$("n-save").addEventListener("click", saveNote);
$("n-cancel").addEventListener("click", resetForm);
$("f-clear").addEventListener("click", () => {
  $("f-tag").value = "";
  $("f-q").value = "";
  load();
});
$("f-tag").addEventListener("change", load);
$("f-q").addEventListener("input", () => {
  clearTimeout(window.__t);
  window.__t = setTimeout(load, 250);
});

resetForm();
load();
</script>
</body>
</html>
